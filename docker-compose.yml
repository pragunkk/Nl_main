services:
  postgres:
    image: postgres:16-alpine
    container_name: nlp-learning-grid-postgres
    environment:
      POSTGRES_DB: nl_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nl_learning"]
      interval: 5s
      timeout: 5s
      retries: 10
  nlp-learning-grid:
    build: .
    image: nlp-learning-grid:latest
    container_name: nlp-learning-grid
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nl_learning
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
